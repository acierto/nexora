name: Release

# Publish macOS and Linux binaries by pushing a tag such as v0.1.0, or by running
# this workflow from the Actions tab with a version; the tag is then created on
# the selected commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and publish, for example v0.1.0"
        required: true
      replace:
        description: "Delete an existing release and tag with this version first"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check version
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' || { echo "invalid version: $VERSION"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build archives
        run: scripts/release-build.sh "$VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.replace }}" = "true" ] && gh release view "$VERSION" >/dev/null 2>&1; then
            gh release delete "$VERSION" --cleanup-tag --yes
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then verify=--verify-tag; else verify="--target $GITHUB_SHA"; fi
          gh release create "$VERSION" dist/*.tar.gz dist/install.sh dist/checksums.txt --title "Nexora $VERSION" --generate-notes $verify
